name: Release

# v で始まるタグ（例：v1.0.0）を push すると、1 ファイル版を GitHub Releases に添付する
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  single-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:single
      # フォントを埋め込んでいるので、OFL のライセンス文も一緒に添付する
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
          dist-single/caption-board.html
          dist-single/licenses/*.txt
